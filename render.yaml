# 修必达 FixIt AI · Render Blueprint
# 推送到 GitHub 后，在 Render 控制台选择 Blueprint 即可自动创建服务，获得公开访问 URL。

services:
  - type: web
    name: fixit-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: FIXITAI_DEPLOYMENT_MODE
        value: public
      # 真实 AI 能力：填入智谱 API Key（https://open.bigmodel.cn 获取）
      # 未配置时接口明确返回“AI 未配置”，由用户主动选择模板演示，不静默回退。
      - key: FIXITAI_AI_API_KEY
        sync: false
      - key: FIXITAI_AI_TEXT_MODEL
        value: glm-4-flash
      # 生产会话密钥：由 Render 随机生成，禁止在代码中硬编码
      - key: FIXITAI_SESSION_SECRET
        generateValue: true
      - key: FIXITAI_SESSION_COOKIE_SECURE
        value: "true"
      # 线上账号与设备必须使用可持久化数据库。
      # 在 Render 创建托管 PostgreSQL（或使用其他外部 PostgreSQL）后，
      # 把连接串填入此变量；不要把凭据写入仓库。
      # 未配置时容器内 SQLite 会随重新部署丢失，不能视为线上持久化验收通过。
      - key: FIXITAI_DATABASE_URL
        sync: false
