# 修必达 FixIt AI · 云服务器部署编排（Docker Compose）
# 用法：git clone 后在本目录执行 `docker compose up -d --build`
# AI Key：复制 .env.example 为 .env，填入 FIXITAI_AI_API_KEY（不填则回退本地 Mock 诊断）

services:
  fixitai:
    build: .
    image: fixitai:latest
    container_name: fixitai
    restart: unless-stopped
    ports:
      - "${FIXITAI_PORT:-8000}:8000"
    environment:
      - PORT=8000
      # 智谱 API Key：从 .env 读取；留空 = AI 诊断回退本地模板
      - FIXITAI_AI_API_KEY=${FIXITAI_AI_API_KEY:-}
      - FIXITAI_AI_TEXT_MODEL=${FIXITAI_AI_TEXT_MODEL:-glm-4-flash}
      # SQLite 数据持久化到独立数据卷（容器重建/升级不丢数据）
      - FIXITAI_DATABASE_URL=sqlite:////data/fixitai.db
    volumes:
      - fixitai_data:/data

volumes:
  fixitai_data:
